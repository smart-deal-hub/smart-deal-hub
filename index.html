<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Deal Hub | Smart Shopping Starts Here</title>
<style>
:root{--bg:#f4f7fb;--ink:#172033;--card:#fff;--line:#e5eaf2;--blue:#2563eb;}
*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif;background:var(--bg);color:var(--ink)}
.header{background:#fff;border-bottom:1px solid var(--line);padding:15px;text-align:center;}
.hero{padding:40px 20px;text-align:center;}
.hero h1{font-size:2rem;margin-bottom:10px;color:var(--ink);}
.container{max-width:1000px;margin:0 auto;padding:20px;}
.grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(250px, 1fr));gap:20px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;text-align:center;}
.card img{width:100%;height:180px;object-fit:cover;border-radius:8px;margin-bottom:12px;}
.card h3{font-size:1.1rem;margin:10px 0;}
.card p{font-size:0.9rem;color:#555;margin-bottom:15px;}
.btn{background:var(--blue);color:#fff;padding:8px 16px;text-decoration:none;border-radius:6px;display:inline-block;font-weight:bold;}
</style>
</head>
<body>

<div class="header">
  <h2>Smart Deal Hub</h2>
</div>

<div class="hero">
  <h1>Find your next smart buy.</h1>
  <p>Explore top products, compare deals, and choose what works for your budget.</p>
</div>

<div class="container">
  <div class="grid" id="productGrid">
    <!-- Products yahan automatically show honge -->
  </div>
</div>

<script>
// Yahan aap apne products ki photo, naam aur link badal sakte hain
const products = [
  {
    name: "Wireless Bluetooth Earbuds",
    image: "https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=500",
    desc: "High bass wireless earbuds with long battery life.",
    link: "https://www.amazon.in"
  },
  {
    name: "Smart Fitness Watch",
    image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500",
    desc: "Track your fitness, heart rate, and daily steps easily.",
    link: "https://www.flipkart.com"
  },
  {
    name: "Classic Casual Backpack",
    image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500",
    desc: "Durable and stylish backpack suitable for daily use.",
    link: "https://www.amazon.in"
  }
];

const grid = document.getElementById("productGrid");
products.forEach(p => {
  grid.innerHTML += `
    <div class="card">
      <img src="${p.image}" alt="${p.name}">
      <h3>${p.name}</h3>
      <p>${p.desc}</p>
      <a href="${p.link}" target="_blank" class="btn">View Deal</a>
    </div>
  `;
});
</script>

</body>
</html>
